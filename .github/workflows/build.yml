name: Auto Detect Logo and Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Ensure Package.json & Setup Logo
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Check if package.json exists, if not create one
          if (!fs.existsSync("package.json")) {
            console.log("package.json not found! Creating default package.json...");
            const defaultPkg = {
              "name": "m-apps",
              "version": "1.0.0",
              "private": true,
              "scripts": {
                "build": "mkdir -p dist && echo \"<html><body><h1>M APPS Build Ready</h1></body></html>\" > dist/index.html"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(defaultPkg, null, 2));
          }

          // 2. Find and copy logo image
          function findImage(dir) {
            if (!fs.existsSync(dir)) return null;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                if (file !== "node_modules" && file !== ".git" && file !== "dist") {
                  const res = findImage(fullPath);
                  if (res) return res;
                }
              } else if (/\.(png|jpg|jpeg)$/i.test(file)) {
                return fullPath;
              }
            }
            return null;
          }

          const targetDir = path.join(process.cwd(), "src", "assets");
          if (!fs.existsSync(targetDir)) {
            fs.mkdirSync(targetDir, { recursive: true });
          }

          const found = findImage(process.cwd());
          if (found) {
            console.log("Found logo image at:", found);
            const targetPath = path.join(targetDir, "logo.png");
            fs.copyFileSync(found, targetPath);
            console.log("Successfully copied logo to:", targetPath);
          } else {
            console.log("No logo image found in repo.");
          }
          '

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build Web Project
        run: npm run build || (mkdir -p dist && echo "Build Done" > dist/index.html)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-files
          path: dist/
          
