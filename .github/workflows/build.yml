name: Auto Detect Logo and Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Image Processing Tools
        run: sudo apt-get install -y imagemagick

      - name: Auto Find and Set Logo
        run: |
          echo "Looking for any new image file in src/assets or root..."
          
          # তৈরি করা নিশ্চিত হতে ফোল্ডার চেক
          mkdir -p src/assets

          # যেকোনো png, jpg, jpeg ছবি খুঁজে বের করার কমান্ড
          FOUND_IMAGE=$(find . -maxdepth 3 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) ! -path "*/node_modules/*" ! -path "*/.git/*" | head -n 1)

          if [ -n "$FOUND_IMAGE" ]; then
            echo "Found logo image: $FOUND_IMAGE"
            # ছবিটিকে প্রসেস করে অটোমেটিক logo.png হিসেবে বসিয়ে দেওয়া
            convert "$FOUND_IMAGE" -resize 512x512! src/assets/logo.png
            echo "Logo automatically set to src/assets/logo.png"
          else
            echo "No image found, using default fallback if available."
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web / React Project
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: app-dist-files
          path: dist/
          
