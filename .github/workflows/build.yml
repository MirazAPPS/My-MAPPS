name: Auto Detect Logo and Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Locate Project & Auto Set Logo
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Search for real package.json
          function findPackageJson(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (file === "node_modules" || file === ".git" || file === "dist") continue;
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                const res = findPackageJson(fullPath);
                if (res) return res;
              } else if (file === "package.json") {
                return fullPath;
              }
            }
            return null;
          }

          // 2. Search for any uploaded image logo
          function findImage(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (file === "node_modules" || file === ".git" || file === "dist") continue;
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                const res = findImage(fullPath);
                if (res) return res;
              } else if (/\.(png|jpg|jpeg)$/i.test(file)) {
                return fullPath;
              }
            }
            return null;
          }

          const pkgPath = findPackageJson(process.cwd());
          if (pkgPath) {
            console.log("Found real package.json at:", pkgPath);
            const projectDir = path.dirname(pkgPath);
            const targetAssets = path.join(projectDir, "src", "assets");
            if (!fs.existsSync(targetAssets)) {
              fs.mkdirSync(targetAssets, { recursive: true });
            }
            const logoImage = findImage(process.cwd());
            if (logoImage) {
              console.log("Found logo image at:", logoImage);
              fs.copyFileSync(logoImage, path.join(targetAssets, "logo.png"));
              console.log("Copied logo to:", path.join(targetAssets, "logo.png"));
            }
            fs.writeFileSync("project_path.txt", projectDir);
          } else {
            console.log("No real package.json found!");
            fs.writeFileSync("project_path.txt", ".");
          }
          '

      - name: Build Project
        run: |
          PROJECT_DIR=$(cat project_path.txt)
          echo "Building project in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            npm run build
          else
            echo "No package.json found. Creating build output directory..."
            mkdir -p dist
            echo "<html><body><h1>No React Project Found in Repo</h1></body></html>" > dist/index.html
          fi

          # Copy output to root dist
          if [ "$PROJECT_DIR" != "." ]; then
            mkdir -p ../dist
            cp -r dist/* ../dist/ || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-files
          path: |
            dist/
            **/dist/
            
