name: Auto Detect Logo and Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Auto Find and Set Logo
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function findImage(dir) {
            if (!fs.existsSync(dir)) return null;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                if (file !== "node_modules" && file !== ".git" && file !== "dist") {
                  const res = findImage(fullPath);
                  if (res) return res;
                }
              } else if (/\.(png|jpg|jpeg)$/i.test(file)) {
                return fullPath;
              }
            }
            return null;
          }

          function findPkgDir(dir) {
            if (fs.existsSync(path.join(dir, "package.json"))) return dir;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory() && file !== "node_modules" && file !== ".git") {
                const res = findPkgDir(fullPath);
                if (res) return res;
              }
            }
            return dir;
          }

          const projectDir = findPkgDir(process.cwd());
          const targetDir = path.join(projectDir, "src", "assets");
          if (!fs.existsSync(targetDir)) {
            fs.mkdirSync(targetDir, { recursive: true });
          }

          const found = findImage(process.cwd());
          if (found) {
            console.log("Found logo image at:", found);
            const targetPath = path.join(targetDir, "logo.png");
            fs.copyFileSync(found, targetPath);
            console.log("Successfully copied logo to:", targetPath);
          } else {
            console.log("No logo image found in repo.");
          }
          '

      - name: Build and Install Project
        run: |
          # package.json ফাইল কোথায় আছে তা খুঁজে বের করা
          PROJECT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # ডিপেন্ডেন্সি ইনস্টল ও বিল্ড করা
          npm install --legacy-peer-deps || npm install
          npm run build
          
          # dist ফোল্ডারটিকে মূল ডিরেক্টরিতে নিয়ে আসা
          if [ "$PROJECT_DIR" != "." ]; then
            cp -r dist ../ || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-files
          path: |
            dist/
            **/dist/
            
