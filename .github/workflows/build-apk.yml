name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project automatically
        run: |
          unzip -o *.zip || true
          for d in */ ; do
            if [ -f "${d}package.json" ]; then
              mv "${d}"* . 2>/dev/null || true
              mv "${d}".* . 2>/dev/null || true
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --force
          npm install @capacitor/cli @capacitor/core @capacitor/android --force

      - name: Build Web App Assets
        run: |
          npm run build || true
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "www" ]; then
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><title>App</title></head><body><h1>App Loaded</h1></body></html>' > dist/index.html
          fi

      - name: Setup Capacitor Config & Platform
        run: |
          rm -rf android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "MyMAPPS" "com.mirazapps.mymapps" --web-dir "dist"
          fi
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
