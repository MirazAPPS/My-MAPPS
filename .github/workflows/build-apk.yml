name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          unzip -o *.zip || true
          for d in */ ; do
            if [ -f "${d}package.json" ]; then
              mv "${d}"* . 2>/dev/null || true
              mv "${d}".* . 2>/dev/null || true
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --force
          npm install @capacitor/cli @capacitor/core @capacitor/android --force

      - name: Build Web Project
        run: |
          npm run build --if-present || true
          if [ -d "dist" ]; then
            echo "WEB_DIR=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "WEB_DIR=build" >> $GITHUB_ENV
          else
            mkdir -p www
            echo '<!DOCTYPE html><html><head><title>App</title></head><body><h1>App Loaded</h1></body></html>' > www/index.html
            echo "WEB_DIR=www" >> $GITHUB_ENV
          fi

      - name: Setup Capacitor Configuration & Android
        run: |
          rm -rf android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.mirazapps.mymapps",
            "appName": "MyMAPPS",
            "webDir": "${{ env.WEB_DIR }}",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
