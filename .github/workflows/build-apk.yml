import React, { useState } from 'react';
import { db } from './firebase';
import { collection, addDoc, serverTimestamp } from 'firebase/firestore';

export default function MobileRecharge({ currentUser, userBalance, userPin }) {
  const [phoneNumber, setPhoneNumber] = useState('');
  const [amount, setAmount] = useState('');
  const [pin, setPin] = useState('');
  const [loading, setLoading] = useState(false);

  const handleRecharge = async (e) => {
    e.preventDefault();

    // ১. ৪ সংখ্যার পিন যাচাই
    if (pin !== userPin) {
      alert('ভুল পিন দিয়েছেন! সঠিক ৪ সংখ্যার পিন দিন।');
      return;
    }

    // ২. পর্যাপ্ত ব্যালেন্স আছে কিনা চেক
    const rechargeAmount = Number(amount);
    if (userBalance < rechargeAmount) {
      alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
      return;
    }

    setLoading(true);
    try {
      // ৩. অ্যাডমিন প্যানেলে রিচার্জ রিকোয়েস্ট পাঠানো
      await addDoc(collection(db, 'rechargeRequests'), {
        userId: currentUser?.uid || 'guest',
        userEmail: currentUser?.email || 'N/A',
        phoneNumber: phoneNumber,
        amount: rechargeAmount,
        status: 'pending', // অ্যাডমিন প্যানেলে পেন্ডিং দেখাবে
        createdAt: serverTimestamp()
      });

      alert('মোবাইল রিচার্জ রিকোয়েস্ট সফলভাবে অ্যাডমিন প্যানেলে পাঠানো হয়েছে।');
      setPhoneNumber('');
      setAmount('');
      setPin('');
    } catch (error) {
      console.error('Recharge Error: ', error);
      alert('রিচার্জ রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে।');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ padding: '20px', maxWidth: '400px', margin: 'auto' }}>
      <h2>মোবাইল রিচার্জ</h2>
      <p><b>বর্তমান ব্যালেন্স:</b> ৳ {userBalance}</p>

      <form onSubmit={handleRecharge}>
        <div style={{ marginTop: '10px' }}>
          <label>মোবাইল নম্বর:</label>
          <input type="tel" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} placeholder="017xxxxxxxx" required />
        </div>

        <div style={{ marginTop: '10px' }}>
          <label>টাকার পরিমাণ:</label>
          <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="অ্যামাউন্ট লিখুন" required />
        </div>

        <div style={{ marginTop: '10px' }}>
          <label>৪ সংখ্যার সিক্রেট পিন (PIN):</label>
          <input type="password" maxLength="4" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="****" required />
        </div>

        <button type="submit" disabled={loading} style={{ marginTop: '15px', width: '100%', padding: '10px' }}>
          {loading ? 'প্রসেসিং...' : 'রিচার্জ কনফার্ম করুন'}
        </button>
      </form>
    </div>
  );
}
